name = "logica-brochure-request"
main = "worker/request.mjs"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "logica-solutions.jp/api/request", zone_name = "logica-solutions.jp" }
]

[[r2_buckets]]
binding = "BROCHURES"
bucket_name = "logica-brochures"

[[ratelimits]]
name = "REQUEST_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
[vars]
NOTIFY_TO = "info@logica-solutions.jp"
RESEND_FROM = "no-reply@logica-solutions.jp"