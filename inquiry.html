<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>お問い合わせ | ロジカソリューションズ</title>
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <header>
      <div class="header-in">
        <a class="logo" href="index.html"
          ><span class="logo-mark">≋</span
          ><span
            ><b>Logica Solutions</b><small>ロジカソリューションズ</small></span
          ></a
        >
      </div>
    </header>
    <div class="container">
      <h1>お問い合わせ</h1>
      <p>サービスの導入やご利用について、お気軽にご相談ください。</p>

      <p>サービス資料をご希望の方は <a href="contact.html">資料請求フォーム</a> をご利用ください。</p>

      <form id="requestForm" method="post" action="/api/request" data-success="お問い合わせを受け付けました。担当者からご入力のメールアドレスにご連絡します。">
        <input type="hidden" name="type" value="inquiry" />

        <label for="company">会社名（任意）</label>
        <input id="company" name="company" maxlength="100" autocomplete="organization" />

        <label for="name">お名前 *</label>
        <input id="name" name="name" autocomplete="name" required maxlength="50" />

        <label for="email">メールアドレス *</label>
        <input id="email" name="email" autocomplete="email" type="email" required maxlength="254" />

        <label for="phone">電話番号（任意）</label>
        <input id="phone" name="phone" autocomplete="tel" type="tel" maxlength="30" />

        <label for="topic">ご相談のサービス（任意）</label>
        <select id="topic" name="topic">
          <option value="">選択してください</option>
          <option value="ai-phone">AI電話対応ツール</option>
          <option value="sales-roleplay">AI営業ロープレツール</option>
          <option value="other">その他</option>
        </select>

        <label for="details">お問い合わせ内容 *</label>
        <textarea id="details" name="message" rows="6" maxlength="1000" required></textarea>

        <!-- スパム対策用 -->
        <div class="hp" aria-hidden="true">
          <label>会社URL</label>
          <input name="website" tabindex="-1" autocomplete="off" />
        </div>

        <label>
          <input
            type="checkbox"
            name="consent"
            value="yes"
            required
            style="width: auto"
          />
          入力した情報をお問い合わせへの対応に利用することに同意する
        </label>

        <button type="submit" id="submitButton">お問い合わせを送信する</button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>
    </div>

    <script src="js/contact.js" defer></script>
  </body>
</html>
